# BTP Pulse — Module 14 : intégration continue
#
# À chaque push / pull request : démarre une vraie base PostgreSQL,
# applique le schéma, alimente-la en données de DÉMO (hors-ligne,
# reproductible — pas de dépendance à Eurostat/BOAMP en CI pour éviter
# les échecs dus à un service externe), puis lance la suite de tests
# de chaque module.
name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: btp_pulse
          POSTGRES_USER: btp
          POSTGRES_PASSWORD: btp_pulse_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U btp -d btp_pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: btp_pulse
      PGUSER: btp
      PGPASSWORD: btp_pulse_dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances de tous les modules Python
        run: |
          for req in ingestion database warehouse analytics ml rag api export-terrain bot; do
            pip install -r "$req/requirements.txt"
          done

      - name: Appliquer le schéma + référentiel matériaux (Module 3)
        working-directory: database
        run: python load.py --init --table materiaux

      - name: Générer des données de démo (Modules 1 et 2, hors-ligne)
        run: |
          python ingestion/scraper_prix_materiaux.py --source demo --semaines 60
          python ingestion/scraper_appels_offres.py --source demo

      - name: Charger prix, appels d'offres et devis (Module 3)
        working-directory: database
        run: |
          python load.py --table prix
          python load.py --table ao
          python load.py --table devis --nb-devis 60

      - name: Indexer les devis pour le chatbot RAG (Module 8)
        working-directory: rag
        run: python indexer.py

      - name: Entraîner le modèle de prédiction de prix (Module 7)
        working-directory: ml
        run: python entrainement.py

      - name: Tests — ingestion (Modules 1 et 2)
        working-directory: ingestion
        run: python -m pytest -q

      - name: Tests — base de données (Module 3)
        working-directory: database
        run: python -m pytest -q

      - name: Tests — entrepôt BigQuery, hors-ligne (Module 5)
        working-directory: warehouse
        run: python -m pytest -q

      - name: Tests — statistiques (Module 6)
        working-directory: analytics
        run: python -m pytest -q

      - name: Tests — machine learning (Module 7)
        working-directory: ml
        run: python -m pytest -q

      - name: Tests — chatbot RAG (Module 8)
        working-directory: rag
        run: python -m pytest -q

      - name: Tests — API (Module 9)
        working-directory: api
        run: python -m pytest -q

      - name: Tests — export Excel (Module 12)
        working-directory: export-terrain
        run: python -m pytest -q

      - name: Tests — bot Telegram (Module 13)
        working-directory: bot
        run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard-client/package-lock.json
      - name: Installer et builder le dashboard client (Module 11)
        working-directory: dashboard-client
        run: |
          npm ci
          npm run build

  images-docker:
    runs-on: ubuntu-latest
    needs: [tests, dashboard]
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image API (Module 14)
        run: docker build -f api/Dockerfile -t btp-pulse-api:ci .
      - name: Construire l'image bot (Module 14)
        run: docker build -f bot/Dockerfile -t btp-pulse-bot:ci .
      - name: Construire l'image dashboard (Module 14)
        run: docker build -f dashboard-client/Dockerfile -t btp-pulse-dashboard:ci dashboard-client
