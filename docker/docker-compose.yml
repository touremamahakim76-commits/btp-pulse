# =====================================================================
# BTP Pulse — Module 14 : lancement complet en une commande
# =====================================================================
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml down          (garde les données)
#   docker compose -f docker/docker-compose.yml down -v       (repart de zéro)
#
# Regroupe la base applicative, Airflow, l'API et le dashboard client.
# Les modules "batch" (ingestion, ML, analytics, export Excel) ne sont
# pas des services longue durée : ils sont invoqués par les DAGs
# Airflow, ou lancés à la demande en ligne de commande (cf. leur
# propre dossier).
#
# ⚠️ Ce fichier redéfinit les MÊMES conteneurs que database/docker-
# compose.yml et orchestration/docker-compose.yml (utilisés pendant le
# développement module par module). N'utilise pas les deux en même
# temps : arrête l'un avant de démarrer l'autre (mêmes noms de port).
# =====================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: btp_pulse_pg
    environment:
      POSTGRES_DB: btp_pulse
      POSTGRES_USER: btp
      POSTGRES_PASSWORD: btp_pulse_dev
    ports:
      - "5432:5432"
    volumes:
      - btp_pulse_pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btp -d btp_pulse"]
      interval: 5s
      timeout: 5s
      retries: 12

  postgres_airflow:
    image: postgres:16-alpine
    container_name: btp_pulse_airflow_pg
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow:
    build:
      context: ../orchestration
    container_name: btp_pulse_airflow
    depends_on:
      postgres_airflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow/airflow
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: btp_pulse
      PGUSER: btp
      PGPASSWORD: btp_pulse_dev
    ports:
      - "8080:8080"
    volumes:
      - airflow_home:/opt/airflow
      - ../orchestration/dags:/opt/airflow/dags
      - ../ingestion:/opt/airflow/ingestion
      - ../database:/opt/airflow/database
      - ../analytics:/opt/airflow/analytics
      - ../bot:/opt/airflow/bot
    command: standalone

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: btp_pulse_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: btp_pulse
      PGUSER: btp
      PGPASSWORD: btp_pulse_dev
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: ../dashboard-client
      args:
        VITE_API_URL: http://localhost:8000
    container_name: btp_pulse_dashboard
    depends_on:
      - api
    ports:
      - "5173:80"

  bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    container_name: btp_pulse_bot
    profiles: ["tools"]  # ne démarre pas avec `up` ; lancer via `docker compose run bot`
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: btp_pulse
      PGUSER: btp
      PGPASSWORD: btp_pulse_dev

volumes:
  btp_pulse_pgdata:
  airflow_pgdata:
  airflow_home:
